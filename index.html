<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Chunk World</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        #textureModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            width: 80%;
            max-width: 500px;
        }
        #texturePrompt {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }
        #generateButton {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #generateButton:hover {
            background-color: #45a049;
        }
        #loadingIndicator {
            display: none;
            margin-top: 10px;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div>Position: <span id="position">0, 0</span></div>
        <div>Chunk: <span id="chunk">0, 0</span></div>
    </div>
    <div id="textureModal">
        <h2>Generate Custom Texture</h2>
        <p>Describe the texture you want to create:</p>
        <input type="text" id="texturePrompt" placeholder="e.g., lava stone with glowing cracks">
        <button id="generateButton">Generate Texture</button>
        <div id="loadingIndicator">Generating texture...</div>
    </div>
    <div id="instructions">
        <p>Use WASD or arrow keys to move</p>
        <p>Press SPACE to create custom texture for the block you're standing on</p>
    </div>

    <script>
        // Game configuration
        const CHUNK_SIZE = 16; // Chunks are 16x16 blocks
        const TILE_SIZE = 32; // Each block is 32x32 pixels
        const RENDER_DISTANCE = 3; // How many chunks to render in each direction

        // Initialize WebSimSocket for database access
        const room = new WebsimSocket();

        // Game state
        let player = { x: 0, y: 0 }; // Player position in world coordinates
        let camera = { x: 0, y: 0 }; // Camera position in world coordinates
        let loadedChunks = {}; // Map of loaded chunks
        let textures = {}; // Cache for block textures

        // DOM elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const positionElement = document.getElementById('position');
        const chunkElement = document.getElementById('chunk');
        const textureModal = document.getElementById('textureModal');
        const texturePrompt = document.getElementById('texturePrompt');
        const generateButton = document.getElementById('generateButton');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Convert world coordinates to chunk coordinates
        function worldToChunk(x, y) {
            return {
                chunkX: Math.floor(x / CHUNK_SIZE),
                chunkY: Math.floor(y / CHUNK_SIZE),
                localX: ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE,
                localY: ((y % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE
            };
        }

        // Generate a chunk key from chunk coordinates
        function getChunkKey(chunkX, chunkY) {
            return `${chunkX},${chunkY}`;
        }

        // Create a new empty chunk with default grass texture
        function createEmptyChunk(chunkX, chunkY) {
            const data = Array(CHUNK_SIZE).fill(0).map(() => 
                Array(CHUNK_SIZE).fill('grass')
            );
            
            return {
                chunkX,
                chunkY,
                data
            };
        }

        // Load a chunk from the database or create a new one
        async function loadChunk(chunkX, chunkY) {
            const chunkKey = getChunkKey(chunkX, chunkY);
            
            // Check if already loaded
            if (loadedChunks[chunkKey]) {
                return loadedChunks[chunkKey];
            }
            
            // Try to load from database
            const chunks = room.collection('chunk').filter({ 
                chunkX: chunkX, 
                chunkY: chunkY 
            }).getList();
            
            let chunk;
            if (chunks.length > 0) {
                // Use the chunk from the database
                chunk = {
                    chunkX,
                    chunkY,
                    data: JSON.parse(chunks[0].data)
                };
            } else {
                // Create a new chunk
                chunk = createEmptyChunk(chunkX, chunkY);
                
                // Save the new chunk to the database
                await room.collection('chunk').create({
                    chunkX: chunkX,
                    chunkY: chunkY,
                    data: JSON.stringify(chunk.data)
                });
            }
            
            // Cache the chunk
            loadedChunks[chunkKey] = chunk;
            return chunk;
        }

        // Save a chunk to the database
        async function saveChunk(chunk) {
            const chunks = room.collection('chunk').filter({ 
                chunkX: chunk.chunkX, 
                chunkY: chunk.chunkY 
            }).getList();
            
            if (chunks.length > 0) {
                // Update existing record
                await room.collection('chunk').update(chunks[0].id, {
                    data: JSON.stringify(chunk.data)
                });
            } else {
                // Create new record
                await room.collection('chunk').create({
                    chunkX: chunk.chunkX,
                    chunkY: chunk.chunkY,
                    data: JSON.stringify(chunk.data)
                });
            }
        }

        // Load the chunks around the player
        async function loadVisibleChunks() {
            const { chunkX, chunkY } = worldToChunk(player.x, player.y);
            
            for (let x = chunkX - RENDER_DISTANCE; x <= chunkX + RENDER_DISTANCE; x++) {
                for (let y = chunkY - RENDER_DISTANCE; y <= chunkY + RENDER_DISTANCE; y++) {
                    await loadChunk(x, y);
                }
            }
        }

        // Get the texture for a block type, generating it if not cached
        async function getTexture(type) {
            if (textures[type]) {
                return textures[type];
            }

            // Create a new texture
            const texture = document.createElement('canvas');
            texture.width = TILE_SIZE;
            texture.height = TILE_SIZE;
            const textureCtx = texture.getContext('2d');

            if (type === 'grass') {
                // Simple grass texture
                textureCtx.fillStyle = '#5AAB61';
                textureCtx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                // Add some variation
                for (let i = 0; i < 10; i++) {
                    textureCtx.fillStyle = `rgba(${50 + Math.random() * 20}, ${150 + Math.random() * 20}, ${50 + Math.random() * 20}, 0.5)`;
                    textureCtx.fillRect(
                        Math.random() * TILE_SIZE, 
                        Math.random() * TILE_SIZE, 
                        4 + Math.random() * 4, 
                        4 + Math.random() * 4
                    );
                }
            } else if (type.startsWith('custom:')) {
                // This is a custom texture with a URL
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous"; // Allow loading from other domains
                    img.src = type.substring(7); // Remove 'custom:' prefix
                    img.onload = () => {
                        textureCtx.drawImage(img, 0, 0, TILE_SIZE, TILE_SIZE);
                        resolve(texture);
                    };
                    img.onerror = () => {
                        // On error, create a fallback texture
                        textureCtx.fillStyle = '#FF00FF';
                        textureCtx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                        textureCtx.fillStyle = '#000000';
                        textureCtx.font = '12px Arial';
                        textureCtx.textAlign = 'center';
                        textureCtx.fillText('Error', TILE_SIZE/2, TILE_SIZE/2);
                        resolve(texture);
                    };
                });
            } else {
                // Unknown texture type, make it pink for debugging
                textureCtx.fillStyle = '#FF00FF';
                textureCtx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                textureCtx.fillStyle = '#000000';
                textureCtx.fillText('?', TILE_SIZE / 2, TILE_SIZE / 2);
            }

            textures[type] = texture;
            return texture;
        }

        // Render the world
        async function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate the starting position for rendering
            const startX = Math.floor(camera.x / TILE_SIZE) - Math.ceil(canvas.width / 2 / TILE_SIZE);
            const startY = Math.floor(camera.y / TILE_SIZE) - Math.ceil(canvas.height / 2 / TILE_SIZE);
            const endX = startX + Math.ceil(canvas.width / TILE_SIZE) + 1;
            const endY = startY + Math.ceil(canvas.height / TILE_SIZE) + 1;

            // Render visible tiles
            for (let worldX = startX; worldX <= endX; worldX++) {
                for (let worldY = startY; worldY <= endY; worldY++) {
                    const { chunkX, chunkY, localX, localY } = worldToChunk(worldX, worldY);
                    const chunkKey = getChunkKey(chunkX, chunkY);
                    
                    if (!loadedChunks[chunkKey]) {
                        continue; // Skip if chunk not loaded
                    }
                    
                    const chunk = loadedChunks[chunkKey];
                    const tileType = chunk.data[localY][localX];
                    
                    // Calculate screen position
                    const screenX = Math.round(canvas.width / 2 + (worldX * TILE_SIZE - camera.x));
                    const screenY = Math.round(canvas.height / 2 + (worldY * TILE_SIZE - camera.y));
                    
                    // Draw the tile
                    const texture = await getTexture(tileType);
                    ctx.drawImage(texture, screenX, screenY, TILE_SIZE, TILE_SIZE);
                }
            }

            // Draw player
            const playerScreenX = Math.round(canvas.width / 2);
            const playerScreenY = Math.round(canvas.height / 2);
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(playerScreenX, playerScreenY, TILE_SIZE / 4, 0, Math.PI * 2);
            ctx.fill();

            // Update UI
            positionElement.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
            chunkElement.textContent = `${Math.floor(player.x / CHUNK_SIZE)}, ${Math.floor(player.y / CHUNK_SIZE)}`;
        }

        // Update game state
        async function update() {
            // Center camera on player
            camera.x = player.x * TILE_SIZE;
            camera.y = player.y * TILE_SIZE;

            // Render the game
            await render();

            // Request next frame
            requestAnimationFrame(update);
        }

        // Generate a custom texture using LLM
        async function generateCustomTexture(prompt) {
            loadingIndicator.style.display = 'block';
            
            try {
                // Generate image using the LLM
                const result = await websim.imageGen({
                    prompt: `2D top-down seamless tile texture: ${prompt}`,
                    width: 256,
                    height: 256,
                });

                // Apply the custom texture to the current block
                const { chunkX, chunkY, localX, localY } = worldToChunk(Math.floor(player.x), Math.floor(player.y));
                const chunkKey = getChunkKey(chunkX, chunkY);
                const chunk = loadedChunks[chunkKey];
                
                if (!chunk) {
                    throw new Error('Current chunk not loaded');
                }

                // Store the texture
                const textureType = `custom:${result.url}`;
                chunk.data[localY][localX] = textureType;

                // Clear texture cache for this type
                delete textures[textureType];
                
                // Save the updated chunk
                await saveChunk(chunk);
                
                // Close the modal
                textureModal.style.display = 'none';
                texturePrompt.value = '';
            } catch (error) {
                console.error('Error generating texture:', error);
                alert('Failed to generate texture. Please try again.');
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // Initialize the game
        async function init() {
            await room.initialize();
            
            // Subscribe to chunk updates
            room.collection('chunk').subscribe(function(chunks) {
                // Update loaded chunks from database
                chunks.forEach(dbChunk => {
                    const chunkKey = getChunkKey(dbChunk.chunkX, dbChunk.chunkY);
                    if (loadedChunks[chunkKey]) {
                        loadedChunks[chunkKey].data = JSON.parse(dbChunk.data);
                    }
                });
            });

            // Load initial chunks
            await loadVisibleChunks();

            // Set up keyboard controls
            const keys = {};
            window.addEventListener('keydown', e => {
                keys[e.key] = true;
                
                // Toggle texture generation modal with space
                if (e.key === ' ' || e.code === 'Space') {
                    textureModal.style.display = 'block';
                    texturePrompt.focus();
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', e => {
                keys[e.key] = false;
            });

            // Movement handler
            setInterval(() => {
                let dx = 0, dy = 0;
                if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
                if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
                if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;

                if (dx !== 0 || dy !== 0) {
                    // Normalize diagonal movement
                    if (dx !== 0 && dy !== 0) {
                        dx *= 0.7071; // 1/sqrt(2)
                        dy *= 0.7071;
                    }
                    
                    // Update player position
                    player.x += dx;
                    player.y += dy;
                    
                    // Load chunks as player moves
                    loadVisibleChunks();
                }
            }, 50); // 20 updates per second for movement

            // Generate texture button
            generateButton.addEventListener('click', () => {
                const prompt = texturePrompt.value.trim();
                if (prompt) {
                    generateCustomTexture(prompt);
                }
            });

            // Handle pressing Enter in texture prompt
            texturePrompt.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    const prompt = texturePrompt.value.trim();
                    if (prompt) {
                        generateCustomTexture(prompt);
                    }
                }
                if (e.key === 'Escape' || e.keyCode === 27) {
                    textureModal.style.display = 'none';
                }
            });

            // Close modal if clicked outside
            window.addEventListener('click', (e) => {
                if (e.target === textureModal) {
                    textureModal.style.display = 'none';
                }
            });

            // Start the game loop
            update();
        }

        // Start the game
        init();
    </script>
